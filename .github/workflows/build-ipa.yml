name: Build TrollNotes IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive (Unsigned for TrollStore)
        run: |
          xcodebuild archive \
            -workspace ios/TrollNotes.xcworkspace \
            -scheme TrollNotes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrollNotes.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          cp -r build/TrollNotes.xcarchive/Products/Applications/TrollNotes.app Payload/
          zip -r -9 TrollNotes.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollNotes-TrollStore-IPA
          path: TrollNotes.ipa
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrollNotes.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
