name: Build TrollNotes IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build App (Unsigned for TrollStore)
        run: |
          xcodebuild build \
            -workspace ios/TrollNotes.xcworkspace \
            -scheme TrollNotes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "TrollNotes.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: TrollNotes.app not found in build directory"
            find build -maxdepth 4 -ls
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 TrollNotes.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollNotes-TrollStore-IPA
          path: TrollNotes.ipa
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrollNotes.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
