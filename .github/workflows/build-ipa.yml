name: Build TrollNotes IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.2+ for Expo SDK 57)
        run: |
          # Expo SDK 57 (expo-modules-jsi) requires Swift tools version >= 6.2
          # Select Xcode 26.x which provides Swift 6.2+ on macos-15 runner
          for xcode_path in \
            "/Applications/Xcode_26.3.app" \
            "/Applications/Xcode_26.2.app" \
            "/Applications/Xcode_26.1.1.app" \
            "/Applications/Xcode_26.0.1.app" \
            "/Applications/Xcode_26.app" \
            "/Applications/Xcode_16.4.app" \
            "/Applications/Xcode_16.3.app"; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -switch "$xcode_path"
              echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> $GITHUB_ENV
              export DEVELOPER_DIR="$xcode_path/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure Swift tools compatibility for expo-modules-jsi
        run: |
          node scripts/patch-expo-modules-jsi.js
          SWIFT_VER=$(swift -version 2>/dev/null | grep -oE "Swift version [0-9]+\.[0-9]+" | awk '{print $3}' || echo "6.2")
          echo "Active Swift version: $SWIFT_VER"
          if [[ "$SWIFT_VER" == "6.0"* || "$SWIFT_VER" == "6.1"* ]]; then
            echo "Adapting Package.swift for Swift $SWIFT_VER..."
            sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' node_modules/expo-modules-jsi/apple/Package.swift 2>/dev/null || \
            sed -i 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' node_modules/expo-modules-jsi/apple/Package.swift || true
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build App (Unsigned for TrollStore)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/TrollNotes.xcworkspace \
            -scheme TrollNotes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee xcodebuild.log

      - name: Report Build Errors
        if: failure()
        run: |
          echo "### ❌ XcodeBuild Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          (grep -i -C 2 -E "error:|fatal error:" xcodebuild.log | head -n 60) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Tail of Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "::error title=XcodeBuild Failure::$(grep -m 1 -i 'error:' xcodebuild.log || echo 'Xcode build failed')"
          echo "=== EXCERPT OF ERRORS FROM xcodebuild.log ==="
          grep -i -C 3 -E "error:|fatal error:" xcodebuild.log | head -n 80 || true

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "TrollNotes.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: TrollNotes.app not found in build directory"
            find build -maxdepth 4 -ls
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 TrollNotes.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollNotes-TrollStore-IPA
          path: TrollNotes.ipa
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrollNotes.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
